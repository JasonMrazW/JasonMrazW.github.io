  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" data-action="home" aria-label="回到听写设置">
          <span class="brand-mark">听</span>
          <span><strong>小小听写员</strong><small>支持语文和英语自助家默</small></span>
        </button>
      </header>

      <main id="app" class="app-main" aria-live="polite"></main>

      <footer class="footer-note">
        <details id="diagnostics-panel" class="diagnostics-panel">
          <summary>遇到问题？复制诊断信息</summary>
          <p>仅保留本机最近 7 天、最多 50 条错误。不自动上传，不含姓名或听写原文。请先查看，再复制发给工具作者。</p>
          <div class="diagnostics-actions"><button type="button" class="button button-quiet" id="diagnostics-copy">复制诊断信息</button><button type="button" class="button button-quiet" id="diagnostics-clear">清空本机记录</button></div>
          <p id="diagnostics-status" role="status"></p>
          <label for="diagnostics-text">诊断内容（也可长按全选复制）</label>
          <textarea id="diagnostics-text" readonly rows="7" spellcheck="false"></textarea>
        </details>
